<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum vitae</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">

  <style>
    :root {
      --paper: #ffffff;
      --soft: #f7f7f5;
      --ink: #101010;
      --ink-2: #3a3a3a;
      --muted: #6e6e6e;
      --line: #e4e4e4;
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* --- bar ---------------------------------------------------------------- */
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 18px;
      height: 58px;
      padding: 0 clamp(16px, 3vw, 32px);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .bar__back,
    .bar__download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 500 9.5px/1 var(--sans);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }
    .bar__back { color: var(--muted); }
    .bar__back:hover { color: var(--ink); }
    .bar__back svg { width: 10px; height: 10px; }

    .bar__title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--serif);
      font-weight: 300;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }
    .bar__count {
      font: 500 9.5px/1 var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .bar__download {
      padding-bottom: 3px;
      border-bottom: 1px solid var(--ink);
    }
    .bar__download svg { width: 10px; height: 10px; }

    :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* --- pages -------------------------------------------------------------- */
    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2vw, 22px);
      padding: clamp(18px, 3vw, 36px) clamp(12px, 3vw, 28px) clamp(40px, 6vw, 72px);
      min-height: calc(100dvh - 58px);
    }
    .page-wrap {
      width: 100%;
      max-width: 880px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 8px 30px rgba(0, 0, 0, 0.05);
    }
    .page-wrap canvas { display: block; width: 100%; height: auto; }

    .state {
      margin: 0;
      padding: 72px 20px;
      font: 500 9.5px/1.8 var(--sans);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .state a {
      display: inline-block;
      margin-top: 12px;
      padding-bottom: 3px;
      border-bottom: 1px solid currentColor;
      color: var(--ink);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .bar { gap: 12px; height: 52px; }
      .bar__count { display: none; }
      .bar__title { font-size: 0.95rem; }
      .pages { min-height: calc(100dvh - 52px); padding: 14px 10px 40px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="bar__back" id="backLink" href="../">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
      <span>Back</span>
    </a>
    <span class="bar__title" id="docTitle">Curriculum vitae</span>
    <span class="bar__count" id="pageCount"></span>
    <a class="bar__download" id="downloadBtn" href="#" download>
      <span>Download</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>
    </a>
  </header>

  <main class="pages" id="pages" aria-label="Document">
    <p class="state" id="state">Loading document&hellip;</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var pagesEl = document.getElementById("pages");
      var stateEl = document.getElementById("state");
      var countEl = document.getElementById("pageCount");
      var titleEl = document.getElementById("docTitle");
      var downloadBtn = document.getElementById("downloadBtn");
      var backLink = document.getElementById("backLink");

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }

      /* Back goes to the page the reader was opened from, not always home. */
      if (backLink) {
        backLink.addEventListener("click", function (event) {
          var ref = document.referrer || "";
          if (ref && ref.indexOf(location.origin) === 0 && history.length > 1) {
            event.preventDefault();
            history.back();
          }
        });
      }

      /* Where the PDF lives: ?url=… wins; otherwise read header.cv.file from
         the site data, so the button and the reader never disagree. */
      function documentUrl() {
        var given = params.get("url");
        if (given) return Promise.resolve(given);

        return fetch("../data/site.json", { cache: "no-store" })
          .then(function (response) { return response.ok ? response.json() : {}; })
          .then(function (site) {
            var cv = (site.header && site.header.cv) || {};
            var file = String(cv.file || "assets/cv.pdf").trim();
            if (/^(https?:)?\/\//.test(file) || file.charAt(0) === "/" || file.indexOf("../") === 0) {
              return file;
            }
            return "../" + file;
          })
          .catch(function () { return "../assets/cv.pdf"; });
      }

      function fileName(path) {
        return decodeURIComponent(String(path).split("#")[0].split("?")[0].split("/").pop() || "document.pdf");
      }

      function pageLabel(total) {
        return total === 1 ? "1 page" : total + " pages";
      }

      function fail(message) {
        stateEl.innerHTML = "";
        stateEl.appendChild(document.createTextNode(message));
        if (downloadBtn) {
          var link = document.createElement("a");
          link.href = downloadBtn.href;
          link.textContent = "Download instead";
          link.setAttribute("download", downloadBtn.getAttribute("download") || "document.pdf");
          stateEl.appendChild(document.createElement("br"));
          stateEl.appendChild(link);
        }
      }

      function render(pdf) {
        var pad = parseFloat(getComputedStyle(pagesEl).paddingLeft) || 0;
        var available = Math.max(280, pagesEl.clientWidth - pad * 2);
        var cssWidth = Math.min(available, 880);
        var dpr = Math.max(1, window.devicePixelRatio || 1);

        if (countEl) countEl.textContent = pageLabel(pdf.numPages);

        var queue = Promise.resolve();
        for (var n = 1; n <= pdf.numPages; n += 1) {
          (function (pageNumber) {
            queue = queue.then(function () {
              return pdf.getPage(pageNumber).then(function (page) {
                var natural = page.getViewport({ scale: 1 });
                var viewport = page.getViewport({ scale: (cssWidth / natural.width) * dpr });

                var wrap = document.createElement("div");
                wrap.className = "page-wrap";
                var canvas = document.createElement("canvas");
                canvas.style.aspectRatio = natural.width + " / " + natural.height;
                canvas.width = Math.max(1, Math.floor(viewport.width));
                canvas.height = Math.max(1, Math.floor(viewport.height));
                wrap.appendChild(canvas);
                pagesEl.appendChild(wrap);

                return page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
              });
            });
          })(n);
        }
        return queue;
      }

      documentUrl()
        .then(function (url) {
          var name = fileName(url);
          if (downloadBtn) {
            downloadBtn.href = url;
            downloadBtn.setAttribute("download", name);
          }

          fetch(url)
            .then(function (response) {
              if (!response.ok) throw new Error("Could not load the document (" + response.status + ")");
              return response.arrayBuffer();
            })
            .then(function (buffer) {
              return pdfjsLib.getDocument({ data: buffer }).promise;
            })
            .then(function (pdf) {
              if (stateEl) stateEl.remove();
              if (titleEl) titleEl.textContent = "Curriculum vitae";
              return render(pdf).then(function () { pagesEl.scrollTop = 0; });
            })
            .catch(function (error) {
              fail(error && error.message ? error.message : "Could not load this document.");
              if (console && console.error) console.error("[pdf]", error);
            });
        });
    })();
  </script>
</body>
</html>
